<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Hisab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E2;
    --surface:#FFFDF6;
    --ink:#2E241A;
    --ink-soft:#6B5D4C;
    --turmeric:#D98E04;
    --turmeric-dark:#B8760A;
    --spice:#A63A2D;
    --green:#4F7942;
    --line:#E8DCC4;
    --shadow: 0 2px 10px rgba(46,36,26,0.08);
    --font-head:'Baloo 2','Noto Sans Oriya','Noto Sans Devanagari',sans-serif;
    --font-body:'Noto Sans','Noto Sans Oriya','Noto Sans Devanagari',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg) url('kitchen-bg.jpg') center/cover fixed no-repeat;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:rgba(250,243,226,0.55);
    z-index:0;
  }
  html{ overscroll-behavior-y:contain; }
  body{ overscroll-behavior-y:contain; }
  #rationCard{
    position:relative;
    background-size:cover;
    background-position:center;
    transition:background-image 0.6s ease-in-out;
    overflow:hidden;
  }
  #rationCard::before{
    content:'';
    position:absolute; inset:0;
    background:rgba(255,253,246,0.80);
    z-index:0;
    border-radius:14px;
  }
  #rationCard > *{ position:relative; z-index:1; }
  #membersCard{
    position:relative;
    background-image:url('members-bg.jpg');
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  #membersCard::before{
    content:'';
    position:absolute; inset:0;
    background:rgba(255,253,246,0.80);
    z-index:0;
    border-radius:14px;
  }
  #membersCard > *{ position:relative; z-index:1; }
  header, main, nav.tabbar{ position:relative; z-index:1; }
  h1,h2,h3,.brand{font-family:var(--font-head);}
  header{
    padding:18px 18px 14px;
    background:var(--surface);
    border-bottom:2px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .header-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  header .brand{
    font-size:22px; font-weight:700; color:var(--spice);
    display:flex; align-items:center; gap:8px;
  }
  header .sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .sync-status{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .lang-switch{
    display:flex; gap:4px; background:var(--bg); border:1.5px solid var(--line);
    border-radius:999px; padding:3px; flex-shrink:0;
  }
  .lang-switch button{
    border:none; background:none; font-size:12px; font-weight:700;
    padding:5px 9px; border-radius:999px; cursor:pointer; color:var(--ink-soft);
    font-family:var(--font-body);
  }
  .lang-switch button.active{background:var(--turmeric); color:#fff;}
  main{padding:16px; max-width:520px; margin:0 auto;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .section-title{
    font-size:19px; font-weight:600; margin:4px 2px 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:999px; font-size:13px; font-weight:600;
    border:none; cursor:pointer; font-family:var(--font-body);
  }
  .pill.khatam{background:#F6DAD6; color:var(--spice);}
  .pill.available{background:#DCEBD4; color:var(--green);}
  .item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid var(--line);
    gap:10px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-name{font-weight:600; font-size:15px; flex:1;}
  .del-btn{
    background:#F6DAD6; border:none; color:var(--spice); font-size:16px; font-weight:700;
    cursor:pointer; padding:6px 11px; line-height:1; border-radius:8px; min-width:34px; min-height:34px;
  }
  .empty{
    text-align:center; color:var(--ink-soft); padding:24px 10px; font-size:14px;
  }
  form.inline{display:flex; gap:8px; margin-top:4px;}
  input, select{
    font-family:var(--font-body);
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus{outline:none; border-color:var(--turmeric);}
  .btn{
    background:var(--turmeric);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
    font-family:var(--font-body);
  }
  .btn:disabled{opacity:0.6;}
  .btn:active{background:var(--turmeric-dark);}
  .expense-row{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 4px; border-bottom:1px solid var(--line); gap:10px;
  }
  .expense-row:last-child{border-bottom:none;}
  .expense-who{font-weight:600; font-size:14px;}
  .expense-what{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .expense-amt{font-weight:700; color:var(--spice); font-size:15px; white-space:nowrap;}
  .total-banner{
    background:linear-gradient(135deg, var(--turmeric), var(--turmeric-dark));
    color:#fff; border-radius:14px; padding:16px; margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .total-banner .label{font-size:13px; opacity:0.9;}
  .total-banner .val{font-size:24px; font-weight:700; font-family:var(--font-head);}
  .member-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:#F1E7CF; border-radius:999px; padding:6px 12px 6px 14px;
    font-size:13px; font-weight:600; margin:4px 6px 4px 0;
  }
  .member-chip button{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px;
  }
  .balance-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .balance-row:last-child{border-bottom:none;}
  .bal-name{font-weight:600; font-size:14px;}
  .bal-amt.pos{color:var(--green); font-weight:700;}
  .bal-amt.neg{color:var(--spice); font-weight:700;}
  .settle-line{
    font-size:13.5px; padding:8px 4px; border-bottom:1px solid var(--line);
  }
  .settle-line:last-child{border-bottom:none;}
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:2px solid var(--line);
    display:flex; z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:12px 4px 10px;
    font-family:var(--font-body); font-size:12px; font-weight:600; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
  }
  nav.tabbar button .ic{font-size:19px;}
  nav.tabbar button.active{color:var(--spice);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .muted-link{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px;
    text-decoration:underline; cursor:pointer; padding:6px 0; font-family:var(--font-body);
  }
  .filters{display:flex;gap:8px;margin:0 0 10px;}
  .filters select{flex:1;}
  .status-msg{font-size:12.5px; color:var(--ink-soft); text-align:center; padding:8px;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="brand" id="brandTapZone">🏠 <span id="brandText">Room Hisab</span></div>
      <div class="sub" id="subText"></div>
      <div class="sync-status" id="syncStatus"></div><div style="font-size:10px;opacity:.55;margin-top:2px;">Delete Fix 2.0</div>
    </div>
    <div>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="hi">हिं</button>
        <button data-lang="en">EN</button>
        <button data-lang="or">ଓଡ଼ି</button>
      </div>
      <button id="headerRefreshBtn" style="margin-top:6px; width:100%; background:none; border:1.5px solid var(--line); color:var(--ink-soft); font-size:12px; font-weight:700; padding:5px 9px; border-radius:999px; cursor:pointer; font-family:var(--font-body);">🔄 Refresh</button>
    </div>
  </div>
</header>

<main>

  <!-- RATION TAB -->
  <section id="tab-ration" class="tab-panel active">
    <div class="card" id="rationCard">
      <div class="section-title" id="rationTitle"></div>
      <div id="rationList"></div>
      <form class="inline" id="rationForm" style="margin-top:10px;">
        <input type="text" id="rationInput" required>
        <button class="btn" type="submit" id="rationAddBtn"></button>
      </form>
    </div>
    <div class="status-msg" id="rationHint"></div>
  </section>

  <!-- KHARCHA TAB -->
  <section id="tab-kharcha" class="tab-panel">
    <div class="total-banner">
      <div>
        <div class="label" id="monthTotalLabel"></div>
        <div class="val" id="monthTotal">₹0</div>
      </div>
      <div style="font-size:28px;">💸</div>
    </div>
    <div class="card">
      <div class="section-title" id="newExpenseTitle"></div>
      <form id="expenseForm">
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <select id="expMember" required></select>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <input type="number" id="expAmount" min="1" required>
        </div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="expNote" required>
        </div>
        <button class="btn" type="submit" id="addExpenseBtn" style="margin-top:10px; width:100%;"></button>
      </form>
    </div>
    <div class="card">
      <div class="section-title" id="recentExpensesTitle"></div>
      <div class="filters"><select id="expenseYear"></select><select id="expenseMonth"></select></div>
      <div id="expenseList"></div>
    </div>
  </section>

  <!-- HISAB TAB -->
  <section id="tab-hisab" class="tab-panel">
    <div class="card" id="membersCard">
      <div class="section-title" id="membersTitle"></div>
      <div id="memberChips"></div>
      <form class="inline" id="memberForm" style="margin-top:10px;">
        <input type="text" id="memberInput" required>
        <button class="btn" type="submit" id="memberAddBtn"></button>
      </form>
    </div>
    <div class="card">
      <div class="section-title" id="balanceTitle"></div>
      <div class="filters"><select id="settleYear"></select><select id="settleMonth"></select></div>
      <div id="balanceList"></div>
    </div>
    <div class="card">
      <div class="section-title" id="settleTitle"></div>
      <div id="settleList"></div>
    </div>
    <div class="card">
      <div class="section-title">📚 All Months History</div>
      <div id="allMonthsHistory"></div>
    </div>
    <div class="card">
      <button class="muted-link" id="refreshBtn"></button> ·
      <button class="muted-link" id="resetBtn"></button>
      <div id="resetPanel" style="display:none; margin-top:10px;">
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <select id="resetYear"></select>
          <select id="resetMonth"></select>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" id="resetMonthBtn" style="background:var(--spice);"></button>
          <button class="btn" id="resetYearBtn" style="background:var(--spice);"></button>
          <button class="muted-link" id="resetCancelBtn"></button>
        </div>
      </div>
    </div>
  </section>


  <!-- RENT TAB -->
  <section id="tab-rent" class="tab-panel">
    <div class="card">
      <div class="section-title">🏠 Rent & Bills</div>
      <form id="rentForm">
        <div style="display:flex;gap:8px;margin-bottom:8px;"><select id="rentYear" required></select><select id="rentMonth" required></select></div>
        <input id="roomRent" type="number" min="0" placeholder="Room rent (₹)" required style="margin-bottom:8px;">
        <input id="electricBill" type="number" min="0" placeholder="Electricity bill (₹)" required style="margin-bottom:8px;">
        <div id="extraCharges"></div>
        <button type="button" class="muted-link" id="addExtraBtn">＋ Add extra charge</button>
        <button class="btn" type="submit" style="width:100%;margin-top:8px;">Add rent record</button>
      </form>
    </div>
    <div class="card"><div class="section-title">Rent records</div><div id="rentList"></div></div>
  </section>

  <!-- MAIN DATA TAB -->
  <section id="tab-main" class="tab-panel">
    <div class="card">
      <div class="section-title">📚 Main Data / Master File</div>
      <div style="display:flex;gap:8px;margin-bottom:10px;"><select id="mainYear"></select><select id="mainMonth"></select></div>
      <div id="mainDataView"></div>
    </div>
  </section>

  <!-- ADMIN TAB (hidden unless unlocked on this device) -->
  <section id="tab-admin" class="tab-panel">
    <div class="card">
      <div class="section-title">⚙️ Devices</div>
      <div id="adminDeviceList"></div>
    </div>
    <div class="card">
      <div class="section-title">📋 Recent activity</div>
      <div id="adminActivityLog"></div>
    </div>
  </section>

</main>

<div id="blockScreen" style="display:none; position:fixed; inset:0; z-index:999; background:var(--bg); align-items:center; justify-content:center; text-align:center; padding:30px;">
  <div>
    <div style="font-size:40px; margin-bottom:10px;">⛔</div>
    <div style="font-weight:700; font-size:18px;">Access blocked</div>
  </div>
</div>

<div id="adminPasswordModal" style="display:none; position:fixed; inset:0; z-index:998; background:rgba(46,36,26,0.55); align-items:center; justify-content:center; padding:24px;">
  <div class="card" style="width:100%; max-width:340px;">
    <div class="section-title">🔒 Admin password</div>
    <input type="password" id="adminPasswordInput" placeholder="Password" style="margin-bottom:10px;">
    <div id="adminPasswordMsg" style="font-size:12.5px; color:var(--spice); min-height:16px; margin-bottom:6px;"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="adminPasswordOkBtn" style="flex:1;">Unlock</button>
      <button class="muted-link" id="adminPasswordCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<button class="btn" id="saveAllBtn" style="position:fixed; bottom:72px; left:16px; right:16px; width:calc(100% - 32px); z-index:9;">💾 Save / Sync</button>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="ration"><span class="ic">🧺</span><span id="navRation"></span></button>
  <button class="tab-btn" data-tab="kharcha"><span class="ic">🧾</span><span id="navKharcha"></span></button>
  <button class="tab-btn" data-tab="hisab"><span class="ic">🤝</span><span id="navHisab"></span></button>
  <button class="tab-btn" data-tab="rent"><span class="ic">🏠</span><span>Rent</span></button>
  <button class="tab-btn" data-tab="main"><span class="ic">📚</span><span>Main Data</span></button>
  <button class="tab-btn" data-tab="admin" id="navAdminBtn" style="display:none;"><span class="ic">⚙️</span><span>Admin</span></button>
</nav>

function getDeviceId(){
  let id = localStorage.getItem('device-id');
  if(!id){ id = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); localStorage.setItem('device-id', id); }
  return id;
}

async function fetchRemote(){
  const res = await fetch(DB_URL, { cache:'no-store' });
  if(!res.ok) throw new Error('fetch failed');
  const json = await res.json();
  const safe = json && typeof json === 'object' ? json : {};
  return {
    members: Array.isArray(safe.members) ? safe.members : [],
    ration: Array.isArray(safe.ration) ? safe.ration : [],
    expenses: Array.isArray(safe.expenses) ? safe.expenses : [],
    rent: Array.isArray(safe.rent) ? safe.rent : [],
    devices: safe.devices && typeof safe.devices === 'object' ? safe.devices : {},
    blockedDevices: safe.blockedDevices && typeof safe.blockedDevices === 'object' ? safe.blockedDevices : {},
    activityLog: Array.isArray(safe.activityLog) ? safe.activityLog : []
  };
}
async function pushRemote(newData){
  const res = await fetch(DB_URL, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(newData)
  });
  if(!res.ok) throw new Error('push failed');
}


// Fetch the newest database state before every change.
// This prevents an old local copy (especially device-tracking data) from
// overwriting a newer expense/delete made on another action/device.
async function withLatest(mutator, actionLabel){
  if(busy) return;
  busy = true;
  setSyncStatus(T().syncing);

  try{
    const latest = await fetchRemote();
    mutator(latest);

    if(actionLabel){
      if(!latest.activityLog) latest.activityLog = [];
      latest.activityLog.push({
        device: getDeviceId(),
        action: actionLabel,
        ts: Date.now()
      });
      if(latest.activityLog.length > 60){
        latest.activityLog = latest.activityLog.slice(-60);
      }
    }

    await pushRemote(latest);
    data = latest;
    dirty = false;
    setSyncStatus(T().synced);
    renderAll();
  }catch(e){
    dirty = true;
    setSyncStatus(T().syncError);
  }finally{
    busy = false;
  }
}

async function loadAndRender(){
  setSyncStatus(T().syncing);
  try{
    data = await fetchRemote();
    setSyncStatus(T().synced);
  }catch(e){
    setSyncStatus(T().syncError);
  }
  checkBlockedAndRegisterDevice();
  setupMonthFilters();
  renderAll();
}

async function checkBlockedAndRegisterDevice(){
  const id = getDeviceId();
  if(data.blockedDevices && data.blockedDevices[id]){
    document.getElementById('blockScreen').style.display = 'flex';
    return;
  }

  document.getElementById('blockScreen').style.display = 'none';

  // IMPORTANT: update only this device's node with PATCH.
  // Never PUT the entire database here, otherwise a background device update
  // can overwrite a newly-added/deleted expense or activity log.
  const now = Date.now();
  const deviceInfo = data.devices && data.devices[id] ? data.devices[id] : { firstSeen: now };
  const patch = {
    firstSeen: deviceInfo.firstSeen || now,
    lastSeen: now
  };

  fetch(`https://room-manegement-d9cf1-default-rtdb.firebaseio.com/roomhisab/devices/${encodeURIComponent(id)}.json`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(patch)
  }).catch(()=>{});

  if(!data.devices) data.devices = {};
  data.devices[id] = patch;

  if(localStorage.getItem('is-admin') === 'true'){
    document.getElementById('navAdminBtn').style.display = 'flex';
  }
}

function setupMonthFilters(){
  const existingYears=[
    ...data.expenses.map(x=>new Date(x.ts).getFullYear()),
    ...data.rent.map(x=>Number(x.year))
  ].filter(Boolean);
  const baseYear=2026;
  const maxYear=Math.max(new Date().getFullYear()+5, selectedYear, ...existingYears);
  const years=[];
  for(let y=baseYear; y<=maxYear; y++) years.push(y);

  ['expenseYear','settleYear'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
    el.value=String(selectedYear);
  });
  ['expenseMonth','settleMonth'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.innerHTML=monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
    el.value=String(selectedMonth);
  });
}
function bindMonthFilters(){
  ['expenseYear','settleYear'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{selectedYear=Number(e.target.value); syncFilterValues(); renderExpenses(); renderBalances();}));
  ['expenseMonth','settleMonth'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{selectedMonth=Number(e.target.value); syncFilterValues(); renderExpenses(); renderBalances();}));

    return `

        <div class="expense-who">${escapeHtml(ex.member)}</div>

}

// IMPORTANT: expense delete is done directly on the Firebase child that
// contains the expense. It does NOT PUT the whole database back.
// This avoids the old read-modify-write race that could immediately restore
// a deleted expense.
document.getElementById('expenseList').addEventListener('click', async e=>{
  const btn = e.target.closest('button[data-action="delete-expense"]');
  if(!btn) return;

  e.preventDefault();
  e.stopPropagation();

  const expenseId = String(btn.dataset.expenseId || '');
  if(!expenseId || busy) return;

  const localExpense = data.expenses.find(x => String(x.id) === expenseId);
  if(!localExpense) return;
  if(!confirm('Delete this expense?')) return;

  busy = true;
  btn.disabled = true;
  setSyncStatus(T().syncing);

  try{
    // Read the latest array first so we know the Firebase array index.
    const latest = await fetchRemote();
    const index = latest.expenses.findIndex(x => String(x.id) === expenseId);

    if(index < 0){
      data = latest;
      renderAll();
      setSyncStatus(T().synced);
      return;
    }

    const deleteUrl = DB_URL.replace(/\.json$/, '') + '/expenses/' + index + '.json';
    const del = await fetch(deleteUrl, { method:'DELETE', cache:'no-store' });
    if(!del.ok){
      throw new Error('Firebase delete failed (HTTP ' + del.status + ')');
    }

    // Verify from Firebase, not from local state.
    const verified = await fetchRemote();
    if(verified.expenses.some(x => String(x.id) === expenseId)){
      throw new Error('Firebase still contains this expense after delete');
    }

    data = verified;
    dirty = false;
    setSyncStatus(T().synced);
    renderAll();
  }catch(err){
    console.error('Expense delete failed:', err);
    setSyncStatus('⚠️ Delete failed: ' + (err.message || 'try again'));
    try{
      data = await fetchRemote();
      renderAll();
    }catch(_){ }
  }finally{
    busy = false;
    btn.disabled = false;
  }
});

// ---------- BALANCES / SETTLEMENT ----------
function renderBalances(){
  const t = T();
  const balWrap = document.getElementById('balanceList');
  const settleWrap = document.getElementById('settleList');
  if(data.members.length < 2){
    balWrap.innerHTML = `<div class="empty">${t.balanceEmpty}</div>`;
    settleWrap.innerHTML = `<div class="empty">—</div>`;
    return;
  }
  const monthExpenses = data.expenses.filter(ex=>{const d=new Date(ex.ts);return d.getFullYear()===selectedYear&&d.getMonth()===selectedMonth;});
  const rentMonthTotal = data.rent.filter(r=>Number(r.year)===selectedYear&&Number(r.month)===selectedMonth).reduce((s,r)=>s+rentTotal(r),0);
  const total = monthExpenses.reduce((s,ex)=>s+Number(ex.amount),0) + rentMonthTotal;
  const fairShare = total / data.members.length;

  const spent = {};
  data.members.forEach(m=> spent[m]=0);
  monthExpenses.forEach(ex=>{ if(spent[ex.member] !== undefined) spent[ex.member]+=Number(ex.amount); });
  // Rent is a shared obligation: it is divided equally among all members,
  // and is not credited to any single member as if they paid it.

  const balances = data.members.map(m => ({ name:m, balance: Math.round((spent[m]-fairShare)*100)/100 }));

  balWrap.innerHTML = balances.map(b => `
    <div class="balance-row">
      <span class="bal-name">${escapeHtml(b.name)}</span>
      <span class="bal-amt ${b.balance>=0?'pos':'neg'}">
        ₹${Math.abs(b.balance)} ${b.balance>=0 ? t.willGet : t.willGive}
      </span>
    </div>
  `).join('');

  const creditors = balances.filter(b=>b.balance>0.5).map(b=>({...b})).sort((a,b)=>b.balance-a.balance);
  const debtors = balances.filter(b=>b.balance<-0.5).map(b=>({...b, balance:-b.balance})).sort((a,b)=>b.balance-a.balance);
  const lines = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].balance, creditors[j].balance);
    lines.push(`${debtors[i].name} → ${creditors[j].name} : ₹${Math.round(pay)}`);
    debtors[i].balance -= pay;
    creditors[j].balance -= pay;
    if(debtors[i].balance < 0.5) i++;
    if(creditors[j].balance < 0.5) j++;
  }
  settleWrap.innerHTML = lines.length
    ? lines.map(l=>`<div class="settle-line">${l}</div>`).join('')
    : `<div class="empty">${t.settleAllClear}</div>`;
}

// Auto-refresh from the shared bin periodically, and when the tab regains focus
// Automatic sync/refresh disabled. Use Save / Sync manually.
// No sync on tab focus; changes are saved only with Save / Sync.

document.getElementById('saveAllBtn').addEventListener('click', async ()=>{
  if(busy || !dirty) return;
  busy = true;
  setSyncStatus(T().syncing);
  try{
    await pushRemote(data);
    dirty = false;
    setSyncStatus(T().synced);
  }catch(e){
    setSyncStatus(T().syncError);
  }finally{
    busy = false;
    renderAll();
  }
});


// ---------- RENT / MAIN DATA ----------
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fillDateSelects(){
  const years=[]; for(let y=2026;y<=new Date().getFullYear()+5;y++) years.push(y);
  ['rentYear','mainYear'].forEach(id=>{const el=document.getElementById(id); if(el&&!el.options.length) el.innerHTML=years.map(y=>`<option>${y}</option>`).join('');});
  ['rentMonth','mainMonth'].forEach(id=>{const el=document.getElementById(id); if(el&&!el.options.length) el.innerHTML=monthNames.map((m,i)=>`<option value="${i}">${m}</option>`).join('');});
  const now=new Date(); ['rentYear','mainYear'].forEach(id=>document.getElementById(id).value=now.getFullYear()); ['rentMonth','mainMonth'].forEach(id=>document.getElementById(id).value=now.getMonth());
}
function rentTotal(r){return Number(r.roomRent||0)+Number(r.electricBill||0)+(r.extra||[]).reduce((s,x)=>s+Number(x.amount||0),0)}
function renderRent(){
 const list=document.getElementById('rentList'); if(!list)return;
 if(!data.rent.length){list.innerHTML='<div class="empty">No rent records yet</div>';return;}
 list.innerHTML=[...data.rent].sort((a,b)=>b.year-a.year||b.month-a.month).map(r=>`<div class="expense-row"><div><div class="expense-who">${monthNames[r.month]} ${r.year}</div><div class="expense-what">Room: ₹${r.roomRent} · Electricity: ₹${r.electricBill}<br>${(r.extra||[]).map(x=>escapeHtml(x.name)+': ₹'+x.amount).join(' · ')}</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="expense-amt">₹${rentTotal(r)}</div><button class="del-btn" data-rent-id="${r.id}">✕</button></div></div>`).join('');
}
function renderAllMonthsHistory(){
 const wrap=document.getElementById('allMonthsHistory'); if(!wrap)return;
 const keys=new Set();
 data.expenses.forEach(x=>{const d=new Date(x.ts); if(!isNaN(d))keys.add(d.getFullYear()+'-'+d.getMonth());});
 data.rent.forEach(x=>keys.add(x.year+'-'+x.month));
 if(!keys.size){wrap.innerHTML='<div class="empty">No monthly history yet</div>';return;}
 const rows=[...keys].map(k=>{const [y,m]=k.split('-').map(Number);const ex=data.expenses.filter(x=>{const d=new Date(x.ts);return d.getFullYear()===y&&d.getMonth()===m});const rr=data.rent.filter(x=>x.year===y&&x.month===m);const e=ex.reduce((a,x)=>a+Number(x.amount),0),r=rr.reduce((a,x)=>a+rentTotal(x),0);return {y,m,e,r,total:e+r};}).sort((a,b)=>b.y-a.y||b.m-a.m);
 wrap.innerHTML=rows.map(x=>`<div class="item-row"><div><div class="item-name">${monthNames[x.m]} ${x.y}</div><div class="expense-what">Expenses: ₹${x.e} · Rent: ₹${x.r}</div></div><div class="expense-amt">₹${x.total}</div></div>`).join('')+`<div class="total-banner" style="margin-top:10px;margin-bottom:0;"><div><div class="label">All months combined total</div><div class="val">₹${rows.reduce((a,x)=>a+x.total,0)}</div></div></div>`;
}
function renderMainData(){
 const y=Number(document.getElementById('mainYear').value), m=Number(document.getElementById('mainMonth').value); const ex=data.expenses.filter(x=>{const d=new Date(x.ts);return d.getFullYear()===y&&d.getMonth()===m}); const rr=data.rent.filter(x=>x.year===y&&x.month===m); const ration=data.ration;
 const totalExp=ex.reduce((s,x)=>s+Number(x.amount),0), totalRent=rr.reduce((s,x)=>s+rentTotal(x),0);
 document.getElementById('mainDataView').innerHTML=`<div class="item-row"><b>Ration items</b><span>${ration.length}</span></div><div class="item-row"><b>Expenses</b><span>₹${totalExp}</span></div><div class="item-row"><b>Rent & bills</b><span>₹${totalRent}</span></div><div class="item-row"><b>Grand total</b><span>₹${totalExp+totalRent}</span></div><div style="margin-top:10px;font-size:13px;color:var(--ink-soft)">${ex.map(x=>escapeHtml(x.member)+' — ₹'+x.amount+' ('+escapeHtml(x.note)+')').join('<br>')||'No expenses for this month.'}</div>`;
}
const oldRenderAll=renderAll; renderAll=function(){oldRenderAll();renderRent();renderMainData();renderAllMonthsHistory();};
fillDateSelects();
document.getElementById('rentForm').addEventListener('submit',e=>{e.preventDefault();const extra=[...document.querySelectorAll('.extra-charge')].map(row=>({name:row.querySelector('.extra-name').value.trim(),amount:Number(row.querySelector('.extra-amount').value||0)})).filter(x=>x.name&&x.amount);const y=Number(rentYear.value),m=Number(rentMonth.value);withLatest(d=>d.rent.push({id:uid(),year:y,month:m,roomRent:Number(roomRent.value||0),electricBill:Number(electricBill.value||0),extra}), `Added rent: ${monthNames[m]} ${y}`);e.target.reset();fillDateSelects();});
document.getElementById('addExtraBtn').addEventListener('click',()=>{const row=document.createElement('div');row.className='extra-charge';row.style='display:flex;gap:8px;margin-bottom:8px;';row.innerHTML='<input class="extra-name" placeholder="Charge name" required><input class="extra-amount" type="number" min="0" placeholder="Amount ₹" required>';document.getElementById('extraCharges').appendChild(row);});
document.getElementById('rentList').addEventListener('click',e=>{const b=e.target.closest('[data-rent-id]');if(b){const r=data.rent.find(x=>x.id===b.dataset.rentId);const label=r?`Deleted rent: ${monthNames[r.month]} ${r.year}`:'Deleted rent';withLatest(d=>{d.rent=d.rent.filter(x=>x.id!==b.dataset.rentId);}, label);}});
['mainYear','mainMonth'].forEach(id=>document.getElementById(id).addEventListener('change',renderMainData));

// ---------- ADMIN: secret unlock + device block/unblock ----------
const ADMIN_PASSWORD = 'Badal@2003';
let passwordModalCallback = null;
function openPasswordModal(expectedPassword, onSuccess){
  document.getElementById('adminPasswordMsg').textContent = '';
  document.getElementById('adminPasswordInput').value = '';
  document.getElementById('adminPasswordModal').style.display = 'flex';
  passwordModalCallback = { expected: expectedPassword, onSuccess: onSuccess };
}
document.getElementById('adminPasswordCancelBtn').addEventListener('click', ()=>{
  document.getElementById('adminPasswordModal').style.display = 'none';
  passwordModalCallback = null;
});
document.getElementById('adminPasswordOkBtn').addEventListener('click', ()=>{
  const entered = document.getElementById('adminPasswordInput').value;
  if(!passwordModalCallback) return;
  if(entered === passwordModalCallback.expected){
    document.getElementById('adminPasswordModal').style.display = 'none';
    const cb = passwordModalCallback.onSuccess;
    passwordModalCallback = null;
    cb();
  } else {
    document.getElementById('adminPasswordMsg').textContent = 'Wrong password, try again.';
  }
});

let brandTapCount = 0;
let brandTapTimer = null;
document.getElementById('brandTapZone').addEventListener('click', ()=>{

});

function timeAgo(ts){
  if(!ts) return 'never';
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return 'just now';
  if(min < 60) return min+'m ago';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+'h ago';
  const day = Math.floor(hr/24);
  return day+'d ago';
}
function renderAdminList(){
  const el = document.getElementById('adminDeviceList');
  if(!el) return;
  const myId = getDeviceId();
  const devices = data.devices || {};
  const blocked = data.blockedDevices || {};
  const ids = Object.keys(devices).sort((a,b)=> (devices[b].lastSeen||devices[b].firstSeen||0) - (devices[a].lastSeen||devices[a].firstSeen||0));
  let html = '';
  if(!ids.length){
    html = '<div class="empty">No devices seen yet</div>';
  } else {
    html = ids.map(id => {
      const isBlocked = !!blocked[id];
      const label = id + (id === myId ? ' (this device)' : '');
      const last = devices[id].lastSeen || devices[id].firstSeen;
      return `<div class="item-row" style="flex-wrap:wrap;">
        <div style="flex:1; min-width:180px;">
          <div class="item-name" style="font-size:12.5px; word-break:break-all;">${escapeHtml(label)}</div>
          <div style="font-size:11.5px; color:var(--ink-soft);">Last active: ${timeAgo(last)}</div>
        </div>
        <button class="pill ${isBlocked?'khatam':'available'}" data-device-id="${id}" data-action="toggle-block">
          ${isBlocked ? '⛔ Blocked' : '✅ Allowed'}
        </button>
      </div>`;
    }).join('');
  }
  el.innerHTML = html;

  const logEl = document.getElementById('adminActivityLog');
  if(logEl){
    const log = [...(data.activityLog||[])].sort((a,b)=>b.ts-a.ts).slice(0,20);
    logEl.innerHTML = log.length ? log.map(entry => `
      <div class="expense-row">
        <div>
          <div class="expense-who" style="font-size:13px;">${escapeHtml(entry.action)}</div>
          <div class="expense-what" style="font-size:11px; word-break:break-all;">${entry.device===myId?'This device':escapeHtml(entry.device)} · ${timeAgo(entry.ts)}</div>
        </div>
      </div>
    `).join('') : '<div class="empty">No activity yet</div>';
  }
}
document.getElementById('adminDeviceList').addEventListener('click', async e=>{
  const btn = e.target.closest('[data-action="toggle-block"]');
  if(!btn) return;
  const id = btn.dataset.deviceId;
  const willBlock = !(data.blockedDevices && data.blockedDevices[id]);
  await withLatest(d => {
    if(!d.blockedDevices) d.blockedDevices = {};
    if(d.blockedDevices[id]) delete d.blockedDevices[id];
    else d.blockedDevices[id] = true;
  }, (willBlock?'Blocked device: ':'Unblocked device: ')+id);
});
const oldRenderAll2 = renderAll;
renderAll = function(){ oldRenderAll2(); renderAdminList(); };
renderAdminList();
